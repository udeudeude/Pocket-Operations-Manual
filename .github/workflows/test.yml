name: PO-35 simulator checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript syntax
        run: |
          node --check po35-model.js
          node --check po35-audio.js
          node --check po35-app.js
          node --check lcd-engine.js
      - name: Run instrument tests
        run: node tests/po35.test.cjs
